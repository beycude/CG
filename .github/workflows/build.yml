name: Cevirgec APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Imza anahtarini hazirla
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 veya KEYSTORE_PASSWORD secret'i eksik"
            exit 1
          fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > app/keystore.jks
          ALIAS=$(keytool -list -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "PrivateKeyEntry" | head -1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then ALIAS="cevirgec"; fi
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adini ver
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p cikti
          cp app/build/outputs/apk/release/app-release.apk "cikti/Cevirgec-v$VER.apk"
          ls -la cikti

      - uses: actions/upload-artifact@v4
        with:
          name: Cevirgec-v${{ env.VER }}-APK-b${{ github.run_number }}
          path: cikti/*.apk
